<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShoppingHQ</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Crect%20x=%221%22%20y=%221%22%20width=%2262%22%20height=%2262%22%20rx=%2214%22%20fill=%22%23000000%22%20stroke=%22%232389D4%22%20stroke-width=%222%22/%3E%3Cpath%20d=%22M6%2011H12L14.5%2020%22%20fill=%22none%22%20stroke=%22%23F4A623%22%20stroke-width=%223.5%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22/%3E%3Cpath%20d=%22M14%2020H57L51%2044H22Z%22%20fill=%22%23F4A623%22%20stroke=%22%23F4A623%22%20stroke-width=%223.5%22%20stroke-linejoin=%22round%22/%3E%3Cpath%20d=%22M23%2044L25%2049H47%22%20fill=%22none%22%20stroke=%22%23F4A623%22%20stroke-width=%223.5%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22/%3E%3Ccircle%20cx=%2228%22%20cy=%2255%22%20r=%223.5%22%20fill=%22%23F4A623%22/%3E%3Ccircle%20cx=%2245%22%20cy=%2255%22%20r=%223.5%22%20fill=%22%23F4A623%22/%3E%3Cg%20transform=%22translate(-3%200)%20rotate(-2%2037%2032)%22%20fill=%22none%22%20stroke=%22%23000000%22%20stroke-width=%222.8%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22%3E%3Cpath%20d=%22M28%2025L27%2038M36%2025L35.5%2038M27.5%2032L35.8%2031.5%22/%3E%3Cpath%20d=%22M46%2024.5C41%2024.5%2040%2030%2040.5%2034C41%2038.5%2044%2039.5%2046.5%2039.5C50.5%2039.5%2052%2036%2051.5%2031.5C51%2027%2049%2024.5%2046%2024.5Z%22/%3E%3Cpath%20d=%22M47%2035L52%2041%22/%3E%3C/g%3E%3C/svg%3E">
<script>
try{
  var t=localStorage.getItem("shq_theme");
  document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark");
}catch(e){
  document.documentElement.setAttribute("data-theme","dark");
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&family=Just+Another+Hand&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#000000;--tx:#FFFFFF;--ln:#FFFFFF;--bl:#2389D4;--act:#081828;--mu:#AAAAAA;}
html[data-theme="light"]{--bg:#FFFFFF;--tx:#000000;--ln:#000000;--bl:#2389D4;--act:#E0F4FF;--mu:#555555;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:"DM Sans",sans-serif;min-height:100vh;}

/* LOGO */
.g{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:300;letter-spacing:.2em;background:linear-gradient(170deg,#FFFBF0,#F9E07F,#F4A623,#C47D0E,#8A5600);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.sep{width:1px;background:var(--ln);align-self:center;}
.hq{font-family:"Just Another Hand",cursive;display:inline-block;transform:rotate(-2deg);}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg);border:1px solid var(--bl);color:var(--tx);padding:.6rem 1.2rem;border-radius:6px;font-size:.8rem;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center;}
#toast.show{opacity:1;}

/* AUTH */
#auth-screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem;}
.auth-card{display:flex;flex-direction:column;align-items:center;gap:1.75rem;border:1px solid var(--bl);border-radius:12px;padding:2.5rem 2rem;max-width:380px;width:100%;}
.auth-logo{display:flex;align-items:baseline;justify-content:center;}
.auth-logo .g{font-size:20px;}
.auth-logo .sep{height:28px;margin:0 14px;}
.auth-logo .hq{font-size:56px;line-height:1;}
.auth-line{width:100%;display:flex;align-items:center;gap:1rem;font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mu);}
.auth-line::before,.auth-line::after{content:"";flex:1;height:1px;background:var(--ln);opacity:.3;}
.btn-google{display:flex;align-items:center;justify-content:center;gap:.7rem;width:100%;background:transparent;color:var(--tx);border:1px solid var(--bl);border-radius:6px;padding:.85rem 1.5rem;font-family:"DM Sans",sans-serif;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;}
.btn-google:hover{background:var(--act);}
.btn-google svg{width:18px;height:18px;flex-shrink:0;}
.auth-note{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--mu);text-align:center;line-height:1.8;}

/* APP */
#app{display:none;}
.topnav{display:flex;align-items:center;padding:.6rem 1.1rem;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--bg);z-index:100;}
.nav-logo{display:flex;align-items:baseline;}
.nav-logo .g{font-size:16px;}
.nav-logo .sep{height:16px;margin:0 9px;}
.nav-logo .hq{font-size:24px;}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:.5rem;}
.icon-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--bl);background:transparent;color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font-size:.8rem;font-family:"DM Sans",sans-serif;}
.icon-btn:hover{background:var(--act);}
.icon-btn svg{width:16px;height:16px;}
.ico-sun{display:flex;}
.ico-moon{display:none;}
html[data-theme="light"] .ico-sun{display:none;}
html[data-theme="light"] .ico-moon{display:flex;}
.avatar{width:30px;height:30px;border-radius:50%;border:1px solid var(--ln);object-fit:cover;}

.content{max-width:720px;margin:0 auto;padding:1.25rem;}
.wel{font-family:"Just Another Hand",cursive;font-size:32px;line-height:1.1;transform:rotate(-2deg);transform-origin:left center;margin-bottom:.8rem;}
.info{font-size:.8rem;color:var(--mu);line-height:1.6;}

/* ONGLETS */
.tabs{display:flex;gap:.35rem;padding:.6rem 1.1rem;overflow-x:auto;border-bottom:1px solid var(--ln);scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:.35rem .8rem;border:1px solid var(--bl);border-radius:4px;background:transparent;color:var(--tx);font-family:"DM Sans",sans-serif;font-size:.75rem;white-space:nowrap;cursor:pointer;}
.tab.active{background:var(--act);}
.section{display:none;}
.section.active{display:block;}

/* ACCUEIL */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.tile{border:1px solid var(--bl);border-radius:8px;padding:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;}
.tile:hover{background:var(--act);}
.tile-name{font-family:"Just Another Hand",cursive;font-size:28px;line-height:1.1;transform:rotate(-2deg);transform-origin:center center;}
.tile-sub{font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--mu);margin-top:3px;}

/* PAGES */
.ttl{font-family:"Just Another Hand",cursive;font-size:34px;line-height:1;margin-bottom:.9rem;padding-bottom:.5rem;border-bottom:1px solid var(--ln);transform:rotate(-2deg);transform-origin:left center;}

/* LISTES */
.bar{display:flex;gap:.5rem;margin-bottom:.6rem;}
.search{flex:1;min-width:0;background:transparent;color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:.5rem .85rem;font-family:"DM Sans",sans-serif;font-size:16px;outline:none;}
.search:focus{border-color:var(--bl);}
.add{border:1px solid var(--tx);background:var(--tx);color:var(--bg);border-radius:6px;padding:.5rem 1.1rem;font-family:"DM Sans",sans-serif;font-size:.8rem;white-space:nowrap;cursor:pointer;}
.cnt{font-size:.7rem;letter-spacing:.1em;color:var(--mu);margin-bottom:.5rem;min-height:1rem;}
.clr{display:inline-block;border:1px solid var(--ln);background:transparent;color:var(--tx);border-radius:6px;padding:.35rem .8rem;font-family:"DM Sans",sans-serif;font-size:.72rem;cursor:pointer;margin-bottom:.6rem;}
.list{display:flex;flex-direction:column;gap:.45rem;}
.rw{border:1px solid var(--bl);border-radius:8px;padding:.6rem .8rem;display:flex;align-items:center;gap:.6rem;}
.rw.dn{opacity:.4;}
.rw.dn .nm{text-decoration:line-through;}
.ck{width:32px;height:32px;border:1.5px solid var(--tx);border-radius:4px;background:transparent;color:var(--tx);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.9rem;cursor:pointer;padding:0;touch-action:manipulation;}
.rw.dn .ck{background:var(--tx);color:var(--bg);}
.bd{flex:1;min-width:0;cursor:pointer;}
.nm{font-size:1rem;font-weight:500;line-height:1.3;word-break:break-word;}
.ds{font-size:.75rem;color:var(--mu);margin-top:2px;}
.xx{background:none;border:none;color:var(--mu);font-size:.85rem;cursor:pointer;padding:6px;flex-shrink:0;}
.xx:hover{color:#F06060;}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--mu);font-size:.8rem;letter-spacing:.1em;}

/* FENETRE */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:none;align-items:center;justify-content:center;padding:1rem;}
.modal-overlay.open{display:flex;}
.modal{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;width:100%;max-width:420px;padding:1.1rem;display:flex;flex-direction:column;gap:.9rem;}
.modal-title{font-family:"Just Another Hand",cursive;font-size:30px;line-height:1;transform:rotate(-2deg);transform-origin:left center;}
.modal-label{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--mu);margin-bottom:.3rem;}
.modal input{width:100%;background:transparent;color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:.55rem .8rem;font-family:"DM Sans",sans-serif;font-size:16px;outline:none;}
.modal input:focus{border-color:var(--bl);}
.modal-actions{display:flex;gap:.5rem;justify-content:flex-end;}
.btn{border:1px solid var(--ln);background:transparent;color:var(--tx);border-radius:5px;padding:.5rem 1rem;font-family:"DM Sans",sans-serif;font-size:.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.btn.primary{background:var(--tx);color:var(--bg);border-color:var(--tx);}
.btn.danger{border-color:#F06060;color:#F06060;padding:.5rem .7rem;}
.btn svg{width:16px;height:16px;}

/* LISTES AVEC MAGASIN ET PRIX */
.mgmeta{display:flex;align-items:center;gap:.4rem;flex-shrink:0;}
.mag{background:transparent;color:var(--tx);border:1px solid var(--bl);border-radius:4px;padding:3px 6px;font-family:"DM Sans",sans-serif;font-size:16px;max-width:150px;outline:none;cursor:pointer;}
.mag option{background:var(--bg);color:var(--tx);}
.px{border:1px solid var(--ln);border-radius:4px;padding:3px 8px;font-size:.8rem;min-width:52px;text-align:center;cursor:pointer;white-space:nowrap;}
.px.v{color:var(--mu);}
.px-edit{width:64px;background:transparent;color:var(--tx);border:none;outline:none;font-family:"DM Sans",sans-serif;font-size:16px;text-align:center;}
.rw.mg .nm{flex:1;min-width:0;}
.mag-in{width:130px;min-width:0;}
.search.sm-mag{flex:0 0 96px;}
.search.sm-px{flex:0 0 64px;}
@media(max-width:480px){
  .rw.mg{flex-wrap:wrap;}
  .rw.mg .xx{order:2;}
  .rw.mg .mgmeta{order:3;flex-basis:100%;padding-left:42px;}
  .rw.mg .mag{flex:1;max-width:none;min-width:0;}
}
.ep-modal{max-height:92vh;overflow:hidden;}
.ep-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;}
.modal select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:.55rem .8rem;font-family:"DM Sans",sans-serif;font-size:16px;outline:none;}
.modal select:focus{border-color:var(--bl);}
.modal select option{background:var(--bg);color:var(--tx);}
.ep-cats{display:flex;flex-wrap:wrap;gap:.35rem;}
.ep-cat{padding:.35rem .8rem;border:1px solid var(--bl);border-radius:4px;background:transparent;color:var(--tx);font-family:"DM Sans",sans-serif;font-size:.75rem;white-space:nowrap;cursor:pointer;}
.ep-cat.on{background:var(--act);}
.ep-items{display:flex;flex-direction:column;gap:.35rem;overflow-y:auto;min-height:120px;max-height:50vh;}
.ep-row{display:flex;align-items:center;gap:.5rem;border:1px solid var(--ln);border-radius:8px;padding:.3rem .5rem .3rem .75rem;flex-shrink:0;}
.ep-row.in{border-color:var(--bl);}
.ep-nm{flex:1;min-width:0;font-size:.95rem;word-break:break-word;}
.ep-q{font-size:.75rem;color:var(--bl);}
.ep-plus{width:34px;height:34px;border:1px solid var(--bl);border-radius:6px;background:transparent;color:var(--tx);font-size:1.3rem;line-height:1;padding:0;cursor:pointer;flex-shrink:0;touch-action:manipulation;}
.ep-row.in .ep-plus{background:var(--bl);color:#fff;}
</style>
</head>
<body>

<div id="toast"></div>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo"><span class="g">Golden</span><span class="sep"></span><span class="hq">ShoppingHQ</span></div>
    <div class="auth-line">Connexion securisee</div>
    <button class="btn-google" type="button" onclick="signInWithGoogle()">
      <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Continuer avec Google
    </button>
    <div class="auth-note">Acces prive<br>Securise par Firebase Auth</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topnav">
    <div class="nav-logo"><span class="g">Golden</span><span class="sep"></span><span class="hq">ShoppingHQ</span></div>
    <div class="nav-right">
      <button class="icon-btn" type="button" onclick="toggleTheme()" title="Mode clair ou sombre">
        <span class="ico-sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
        <span class="ico-moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
      </button>
      <img class="avatar" id="user-avatar" src="" alt="" style="display:none">
      <button class="icon-btn" type="button" onclick="logout()" title="Quitter">&#10005;</button>
    </div>
  </div>
  <div class="tabs" id="tabs-bar"></div>
  <div class="content" id="app-content"></div>
</div>

<!-- FENETRE AJOUTER / MODIFIER -->
<div class="modal-overlay" id="modal-liste">
  <div class="modal">
    <div class="modal-title" id="liste-modal-title">Nouvel item</div>
    <div>
      <div class="modal-label">Nom</div>
      <input type="text" id="liste-nom" placeholder="Ex: Shampoing" autocomplete="off">
    </div>
    <div>
      <div class="modal-label">Note (optionnel)</div>
      <input type="text" id="liste-desc" placeholder="Ex: format 500ml" autocomplete="off">
    </div>
    <div class="modal-actions">
      <button class="btn danger" type="button" id="liste-del-btn" style="display:none" title="Supprimer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
      <button class="btn" type="button" onclick="fermerModalListe()">Annuler</button>
      <button class="btn primary" type="button" onclick="sauvegarderItem()">Sauvegarder</button>
    </div>
  </div>
</div>

<!-- FENETRE AJOUTER EPICERIE PAR CATEGORIE -->
<div class="modal-overlay" id="modal-epic">
  <div class="modal ep-modal">
    <div class="ep-head">
      <div class="modal-title">Ajouter</div>
      <button class="btn" type="button" id="epic-close">Fermer</button>
    </div>
    <div style="display:flex;justify-content:flex-end;"><button class="btn" type="button" id="epic-new">+ Ajout aliment</button></div>
    <div class="ep-cats" id="epic-cats"></div>
    <div class="ep-items" id="epic-items"></div>
  </div>
</div>

<!-- FENETRE NOUVEL ALIMENT -->
<div class="modal-overlay" id="modal-alim">
  <div class="modal">
    <div class="modal-title">Nouvel aliment</div>
    <div>
      <div class="modal-label">Nom</div>
      <input type="text" id="alim-nom" placeholder="Ex: Tofu" autocomplete="off">
    </div>
    <div>
      <div class="modal-label">Categorie</div>
      <select id="alim-cat"></select>
    </div>
    <div class="modal-actions">
      <button class="btn" type="button" id="alim-annuler">Annuler</button>
      <button class="btn primary" type="button" id="alim-ok">Enregistrer</button>
    </div>
  </div>
</div>

<script>
function signInWithGoogle(){window._signIn&&window._signIn();}
function logout(){window._logout&&window._logout();}
function toggleTheme(){
  var cur=document.documentElement.getAttribute("data-theme");
  var nxt=cur==="light"?"dark":"light";
  document.documentElement.setAttribute("data-theme",nxt);
  try{localStorage.setItem("shq_theme",nxt);}catch(e){}
}

var ONGLETS=["Epicerie","Pharmacie","Dollo","Walmart","Costco","Quincaillerie","Vetements","Maquillage","Autres","A prevoir"];
var LISTES={"Dollo":"dollo","Walmart":"walmart","Costco":"costco"};
var MGL={"Quincaillerie":"quincaillerie","Pharmacie":"pharmacie","Vetements":"vetements","Maquillage":"maquillage","Epicerie":"epicerie"};
var LIBRES={"Autres":"autres","A prevoir":"aprevoir"};
var MAGS={
  quincaillerie:["Rona","Home Depot","Canac","BMR","Home Hardware","Autre"],
  pharmacie:["PJC Jean Coutu","Acces pharma (Walmart)","Familiprix Extra","Familiprix","Pharmaprix","Brunet","Brunet Plus","Uniprix","Proxim","Independante (Costco)","Pharmachoix","Pharmasave","Rexall","Clini plus","Pharmacie Independante"],
  vetements:["Simons","Zara","H&M","Uniqlo","Old Navy","Gap","American Eagle","Garage","Dynamite","Jacob","Ardene","Aritzia","Urban Outfitters","Marie Claire","Winners","Marshalls","Walmart","Costco","Giant Tiger","Sports Experts","Sport Chek","Atmosphere","Lululemon","Decathlon","MEC","Marks","Moores","Bikini Village","Carters / OshKosh","The Childrens Place","Aldo","Pegabo","Browns Shoes"],
  maquillage:["Sephora","MAC Cosmetics","Kiko Milano","NYX Professional Makeup","Benefit Cosmetics","Rickys","Sally Beauty","Yves Rocher","Holt Renfrew","Simons","Pharmaprix","Jean Coutu","Familiprix","Uniprix","Brunet","Proxim","Pharmachoix","Rexall","Walmart","Costco","Giant Tiger","Dollarama","Winners","Marshalls","Ardene","Dynamite"],

function goTab(name){
  var tabs=document.querySelectorAll(".tab");
  for(var i=0;i<tabs.length;i++){
    var on=tabs[i].getAttribute("data-tab")===name;
    tabs[i].classList.toggle("active",on);
    if(on&&tabs[i].scrollIntoView){tabs[i].scrollIntoView({inline:"center",block:"nearest"});}
  }
  var secs=document.querySelectorAll(".section");
  for(var j=0;j<secs.length;j++){
    secs[j].classList.toggle("active",secs[j].getAttribute("data-sec")===name);
  }
}

function buildUI(){
  var bar=document.getElementById("tabs-bar");
  var cont=document.getElementById("app-content");
  var tous=["Accueil"].concat(ONGLETS);
  tous.forEach(function(nom){
    var b=document.createElement("button");
    b.type="button";b.className="tab";b.setAttribute("data-tab",nom);b.textContent=nom;
    b.onclick=function(){goTab(nom);};
    bar.appendChild(b);
    var sec=document.createElement("div");
    sec.className="section";sec.setAttribute("data-sec",nom);
    if(nom==="Accueil"){
      var w=document.createElement("div");
      w.className="wel";w.id="wel";w.textContent="Bonjour";
      sec.appendChild(w);
      var g=document.createElement("div");
      g.className="grid";
      ONGLETS.forEach(function(n){
        var t=document.createElement("div");
        t.className="tile";
        var tn=document.createElement("div");
        tn.className="tile-name";tn.textContent=n;
        t.appendChild(tn);
        t.onclick=function(){goTab(n);};
        g.appendChild(t);
      });
      sec.appendChild(g);
    }else if(LISTES[nom]){
      buildListe(sec,nom,LISTES[nom]);
    }else if(MGL[nom]){
      buildMgl(sec,nom,MGL[nom],false);
    }else if(LIBRES[nom]){
      buildMgl(sec,nom,LIBRES[nom],true);
    }else{
      var ti=document.createElement("div");
      ti.className="ttl";ti.textContent=nom;
      var inf=document.createElement("div");
      inf.className="info";inf.textContent="Cette page est vide pour l instant.";
      sec.appendChild(ti);sec.appendChild(inf);
    }
    cont.appendChild(sec);
  });
  goTab("Accueil");
}
buildUI();

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

  storageBucket:"shoppinghq-543f9.firebasestorage.app",

};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const provider=new GoogleAuthProvider();
const db=getFirestore(app);

function toast(msg,dur){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),dur||3000);
}

window._signIn=async()=>{
  try{await signInWithPopup(auth,provider);}
  catch(e){toast("Erreur: "+e.message);}
};
window._logout=()=>signOut(auth);

/* LISTES SIMPLES : users/{uid}/{dollo|walmart|costco} */
const LISTES=window.LISTES;
const MGL=window.MGL;
const LIBRES=window.LIBRES;
const MAGS=window.MAGS;
const listeData={};
let listeUnsubs={};
let currentUid=null;
let modalListe=null;
let modalEditId=null;

function colRef(id){return collection(db,"users",currentUid,id);}
function docRef(id,docId){return doc(db,"users",currentUid,id,docId);}
function nomListe(id){return Object.keys(LISTES).find(k=>LISTES[k]===id)||"";}

function renderListe(id){
  const ul=document.getElementById("liste-"+id+"-ul");
  const cpt=document.getElementById("liste-"+id+"-cpt");
  const sr=document.getElementById("liste-"+id+"-search");
  if(!ul||!cpt||!sr)return;
  const q=sr.value.trim().toLowerCase();
  const tous=listeData[id]||[];
  let items=tous;
  if(q)items=tous.filter(i=>(i.nom||"").toLowerCase().includes(q)||(i.desc||"").toLowerCase().includes(q));
  ul.innerHTML="";
  const reste=tous.filter(i=>!i.achete).length;
  cpt.textContent=tous.length?reste+" restant"+(reste>1?"s":""):"";
  if(!items.length){
    const e=document.createElement("div");
    e.className="empty";
    e.textContent=q?"Aucun resultat":"Aucun item pour l instant";
    ul.appendChild(e);
    return;
  }
  items.forEach(item=>{
    const row=document.createElement("div");
    row.className="rw"+(item.achete?" dn":"");
    const chk=document.createElement("button");
    chk.type="button";chk.className="ck";
    chk.textContent=item.achete?"✓":"";
    chk.addEventListener("click",e=>{
      e.stopPropagation();
      updateDoc(docRef(id,item.id),{achete:!item.achete}).catch(err=>toast("Erreur: "+err.message));
    });
    const body=document.createElement("div");
    body.className="bd";
    const nm=document.createElement("div");
    nm.className="nm";nm.textContent=item.nom||"";
    body.appendChild(nm);
    if(item.desc){
      const ds=document.createElement("div");
      ds.className="ds";ds.textContent=item.desc;
      body.appendChild(ds);
    }
    body.addEventListener("click",()=>ouvrirModalListe(id,item));
    const x=document.createElement("button");
    x.type="button";x.className="xx";x.textContent="✕";x.title="Supprimer";
    x.addEventListener("click",e=>{
      e.stopPropagation();
      if(!confirm("Supprimer ?"))return;
      deleteDoc(docRef(id,item.id)).catch(err=>toast("Erreur: "+err.message));
    });
    row.appendChild(chk);row.appendChild(body);row.appendChild(x);
    ul.appendChild(row);
  });
}

function stopListeners(){
  Object.values(listeUnsubs).forEach(u=>u&&u());
  listeUnsubs={};
  currentUid=null;
  Object.values(LISTES).forEach(id=>{listeData[id]=[];renderListe(id);});
  Object.values(MGL).forEach(id=>{listeData[id]=[];renderMgl(id);});
  Object.values(LIBRES).forEach(id=>{listeData[id]=[];renderMgl(id);});
  listeData.epicerie_perso=[];
  renderPicker();
}

function ecouter(id,rendu){
  const q=query(colRef(id),orderBy("createdAt","desc"));
  listeUnsubs[id]=onSnapshot(q,snap=>{
    listeData[id]=snap.docs.map(d=>({id:d.id,...d.data()}));
    rendu(id);
  },err=>toast("Erreur: "+err.message));
}

function startListeners(uid){
  stopListeners();
  currentUid=uid;
  Object.values(LISTES).forEach(id=>ecouter(id,renderListe));
  Object.values(MGL).forEach(id=>ecouter(id,id==="epicerie"?(x=>{renderMgl(x);renderPicker();}):renderMgl));
  Object.values(LIBRES).forEach(id=>ecouter(id,renderMgl));
  ecouter("epicerie_perso",renderPicker);
}

/* LISTES AVEC MAGASIN ET PRIX : users/{uid}/{quincaillerie|pharmacie|vetements|maquillage|epicerie} */
function renderMgl(id){
  const ul=document.getElementById("mgl-"+id+"-ul");
  if(!ul)return;
  const act=document.activeElement;
  if(currentUid&&act&&ul.contains(act)&&(act.classList.contains("px-edit")||act.classList.contains("mag-in")))return;
  const items=listeData[id]||[];
  ul.innerHTML="";
  if(!items.length){
    const e=document.createElement("div");
    e.className="empty";
    e.textContent="Aucun item pour l instant";
    ul.appendChild(e);
    return;
  }
  const mags=MAGS[id]||null;
  items.forEach(item=>{
    const row=document.createElement("div");
    row.className="rw mg"+(item.achete?" dn":"");
    const chk=document.createElement("button");
    chk.type="button";chk.className="ck";
    chk.textContent=item.achete?"✓":"";
    chk.addEventListener("click",e=>{
      e.stopPropagation();
      updateDoc(docRef(id,item.id),{achete:!item.achete}).catch(err=>toast("Erreur: "+err.message));
    });
    const nm=document.createElement("div");
    nm.className="nm";nm.textContent=(item.nom||"")+(item.qte>1?" x"+item.qte:"");
    const meta=document.createElement("div");
    meta.className="mgmeta";
    let sel;
    if(!mags){
      sel=document.createElement("input");
      sel.type="text";sel.className="mag mag-in";sel.placeholder="magasin";
      sel.autocomplete="off";sel.value=item.magasin||"";
      sel.addEventListener("click",e=>e.stopPropagation());
      sel.addEventListener("change",()=>{
        updateDoc(docRef(id,item.id),{magasin:sel.value.trim()}).catch(err=>toast("Erreur: "+err.message));
      });
      sel.addEventListener("keydown",e=>{e.stopPropagation();if(e.key==="Enter")sel.blur();});
    }else{
    sel=document.createElement("select");
    sel.className="mag";
    const liste=mags.slice();
    if(item.magasin&&liste.indexOf(item.magasin)<0)liste.push(item.magasin);
    liste.forEach(m=>{
      const o=document.createElement("option");
      o.value=m;o.textContent=m;
      sel.appendChild(o);
    });
    sel.value=item.magasin||mags[0];
    sel.addEventListener("click",e=>e.stopPropagation());
    sel.addEventListener("change",()=>{
      updateDoc(docRef(id,item.id),{magasin:sel.value}).catch(err=>toast("Erreur: "+err.message));
    });
    }
    const px=document.createElement("div");
    px.className="px"+(item.prix?"":" v");
    px.textContent=item.prix||"prix";
    px.addEventListener("click",e=>{
      e.stopPropagation();
      if(px.querySelector("input"))return;
      const cur=item.prix||"";
      const inp=document.createElement("input");
      inp.type="text";inp.className="px-edit";inp.value=cur;
      inp.placeholder="prix";inp.autocomplete="off";inp.inputMode="decimal";
      px.textContent="";
      px.classList.remove("v");
      px.appendChild(inp);
      inp.focus();inp.select();
      let fini=false;
      inp.addEventListener("blur",()=>{
        if(fini)return;
        fini=true;
        const val=inp.value.trim();
        if(val===cur){renderMgl(id);return;}
        updateDoc(docRef(id,item.id),{prix:val}).catch(err=>toast("Erreur: "+err.message));
      });
      inp.addEventListener("keydown",e2=>{if(e2.key==="Enter")inp.blur();});
    });
    meta.appendChild(sel);meta.appendChild(px);
    const x=document.createElement("button");
    x.type="button";x.className="xx";x.textContent="✕";x.title="Supprimer";
    x.addEventListener("click",e=>{
      e.stopPropagation();
      if(!confirm("Supprimer ?"))return;
      deleteDoc(docRef(id,item.id)).catch(err=>toast("Erreur: "+err.message));
    });
    row.appendChild(chk);row.appendChild(nm);row.appendChild(meta);row.appendChild(x);
    ul.appendChild(row);
  });
}

async function ajouterMgl(id){
  if(!currentUid)return;
  const inp=document.getElementById("mgl-"+id+"-input");
  const nom=inp.value.trim();
  if(!nom){toast("Entre un nom");return;}
  try{
    const libre=!MAGS[id];
    const magEl=document.getElementById("mgl-"+id+"-mag");
    const prixEl=document.getElementById("mgl-"+id+"-prix");
    const magasin=libre?(magEl?magEl.value.trim():""):MAGS[id][0];
    const prix=libre?(prixEl?prixEl.value.trim():""):"";
    await addDoc(colRef(id),{nom,magasin,prix,achete:false,createdAt:serverTimestamp()});
    inp.value="";
    if(magEl)magEl.value="";
    if(prixEl)prixEl.value="";
    inp.focus();
  }catch(e){toast("Erreur: "+e.message);}
}

/* AJOUT PAR CATEGORIE (Epicerie) : liste fixe EPIC_CATS + items perso users/{uid}/epicerie_perso */
let epCat=null;
function epItems(cat){
  const base=EPIC_CATS[cat]||[];
  const bas=base.map(n=>n.toLowerCase());
  const extra=(listeData.epicerie_perso||[]).filter(p=>p.cat===cat&&bas.indexOf((p.nom||"").toLowerCase())<0).map(p=>p.nom);
  return base.concat(extra);
}
function epQte(nom){
  const f=(listeData.epicerie||[]).find(i=>!i.achete&&(i.nom||"").toLowerCase()===nom.toLowerCase());
  return f?(f.qte||1):0;
}
function renderPicker(){
  const ov=document.getElementById("modal-epic");
  if(!ov||!ov.classList.contains("open"))return;
  const noms=Object.keys(EPIC_CATS);
  if(!epCat)epCat=noms[0];
  const cb=document.getElementById("epic-cats");
  cb.innerHTML="";
  noms.forEach(k=>{
    const b=document.createElement("button");
    b.type="button";b.className="ep-cat"+(k===epCat?" on":"");b.textContent=k;
    b.addEventListener("click",()=>{epCat=k;renderPicker();document.getElementById("epic-items").scrollTop=0;});
    cb.appendChild(b);
  });
  const lb=document.getElementById("epic-items");
  const top=lb.scrollTop;
  lb.innerHTML="";
  epItems(epCat).forEach(n=>{
    const q=epQte(n);
    const row=document.createElement("div");
    row.className="ep-row"+(q?" in":"");
    const s=document.createElement("span");
    s.className="ep-nm";s.textContent=n;
    const m=document.createElement("span");
    m.className="ep-q";m.textContent=q?"x"+q:"";
    const p=document.createElement("button");
    p.type="button";p.className="ep-plus";p.textContent="+";p.setAttribute("aria-label","Ajouter "+n);
    p.addEventListener("click",()=>ajouterEpic(n));
    row.appendChild(s);row.appendChild(m);row.appendChild(p);
    lb.appendChild(row);
  });
  lb.scrollTop=top;
}
async function ajouterEpic(nom){
  if(!currentUid)return;
  const n=(nom||"").trim();
  if(!n)return;
  const ex=(listeData.epicerie||[]).find(i=>!i.achete&&(i.nom||"").toLowerCase()===n.toLowerCase());
  try{
    if(ex)await updateDoc(docRef("epicerie",ex.id),{qte:(ex.qte||1)+1});
    else await addDoc(colRef("epicerie"),{nom:n,magasin:MAGS.epicerie[0],prix:"",achete:false,createdAt:serverTimestamp()});
  }catch(e){toast("Erreur: "+e.message);}
}
function ouvrirAlim(){
  const sel=document.getElementById("alim-cat");
  sel.innerHTML="";
  Object.keys(EPIC_CATS).forEach(k=>{
    const o=document.createElement("option");
    o.value=k;o.textContent=k;sel.appendChild(o);
  });
  sel.value=epCat||Object.keys(EPIC_CATS)[0];
  document.getElementById("alim-nom").value="";
  document.getElementById("modal-alim").classList.add("open");
  setTimeout(()=>document.getElementById("alim-nom").focus(),150);
}
function fermerAlim(){document.getElementById("modal-alim").classList.remove("open");}
async function enregistrerAlim(){
  if(!currentUid)return;
  const n=document.getElementById("alim-nom").value.trim();
  const cat=document.getElementById("alim-cat").value;
  if(!n){toast("Entre un nom");return;}
  if(epItems(cat).some(x=>x.toLowerCase()===n.toLowerCase())){toast("Deja dans "+cat);return;}
  try{
    await addDoc(colRef("epicerie_perso"),{cat,nom:n,createdAt:serverTimestamp()});
    fermerAlim();
    epCat=cat;
    renderPicker();
    const lb=document.getElementById("epic-items");
    lb.scrollTop=lb.scrollHeight;
    toast("Enregistre dans "+cat);
  }catch(e){toast("Erreur: "+e.message);}
}
function ouvrirPicker(){
  document.getElementById("modal-epic").classList.add("open");
  renderPicker();
}
function fermerPicker(){document.getElementById("modal-epic").classList.remove("open");}

function ouvrirModalListe(id,item){
  modalListe=id;
  modalEditId=item?item.id:null;
  document.getElementById("liste-modal-title").textContent=(item?"Modifier":"Nouvel item")+" - "+nomListe(id);
  document.getElementById("liste-nom").value=item?(item.nom||""):"";
  document.getElementById("liste-desc").value=item?(item.desc||""):"";
  document.getElementById("liste-del-btn").style.display=item?"flex":"none";
  document.getElementById("modal-liste").classList.add("open");
  setTimeout(()=>document.getElementById("liste-nom").focus(),150);
}

window.fermerModalListe=()=>document.getElementById("modal-liste").classList.remove("open");

window.sauvegarderItem=async()=>{
  if(!currentUid||!modalListe)return;
  const nom=document.getElementById("liste-nom").value.trim();
  if(!nom){toast("Entre un nom");return;}
  const desc=document.getElementById("liste-desc").value.trim();
  try{
    if(modalEditId)await updateDoc(docRef(modalListe,modalEditId),{nom,desc});
    else await addDoc(colRef(modalListe),{nom,desc,achete:false,createdAt:serverTimestamp()});
    window.fermerModalListe();
    toast("Sauvegarde");
  }catch(e){toast("Erreur: "+e.message);}
};

async function effacerCoches(id){
  if(!currentUid)return;
  const coches=(listeData[id]||[]).filter(i=>i.achete);
  if(!coches.length){toast("Aucun item coche");return;}
  try{
    await Promise.all(coches.map(i=>deleteDoc(docRef(id,i.id))));
    toast("Items coches supprimes");
  }catch(e){toast("Erreur: "+e.message);}
}

Object.values(LISTES).forEach(id=>{
  document.getElementById("liste-"+id+"-search").addEventListener("input",()=>renderListe(id));
  document.getElementById("liste-"+id+"-add").addEventListener("click",()=>ouvrirModalListe(id,null));
  document.getElementById("liste-"+id+"-clear").addEventListener("click",()=>effacerCoches(id));
});
Object.values(MGL).concat(Object.values(LIBRES)).forEach(id=>{
  document.getElementById("mgl-"+id+"-add").addEventListener("click",()=>{if(id==="epicerie")ouvrirPicker();else ajouterMgl(id);});
  ["input","mag","prix"].forEach(suf=>{
    const el=document.getElementById("mgl-"+id+"-"+suf);
    if(el)el.addEventListener("keydown",e=>{
      if(e.key==="Enter")ajouterMgl(id);
    });
  });
  document.getElementById("mgl-"+id+"-clear").addEventListener("click",()=>effacerCoches(id));
});
document.getElementById("epic-close").addEventListener("click",fermerPicker);
document.getElementById("epic-new").addEventListener("click",ouvrirAlim);
document.getElementById("alim-annuler").addEventListener("click",fermerAlim);
document.getElementById("alim-ok").addEventListener("click",enregistrerAlim);
document.getElementById("alim-nom").addEventListener("keydown",e=>{if(e.key==="Enter")enregistrerAlim();});
document.getElementById("modal-alim").addEventListener("click",e=>{if(e.target.id==="modal-alim")fermerAlim();});
document.getElementById("modal-epic").addEventListener("click",e=>{if(e.target.id==="modal-epic")fermerPicker();});
document.getElementById("liste-del-btn").addEventListener("click",async()=>{
  if(!currentUid||!modalListe||!modalEditId)return;
  try{
    await deleteDoc(docRef(modalListe,modalEditId));
    window.fermerModalListe();
    toast("Supprime");
  }catch(e){toast("Erreur: "+e.message);}
});
document.getElementById("modal-liste").addEventListener("click",e=>{
  if(e.target.id==="modal-liste")window.fermerModalListe();
});
["liste-nom","liste-desc"].forEach(i=>{
  document.getElementById(i).addEventListener("keydown",e=>{
    if(e.key==="Enter")window.sauvegarderItem();
  });
});

onAuthStateChanged(auth,user=>{
  const authScreen=document.getElementById("auth-screen");
  const appEl=document.getElementById("app");
  if(user){
    authScreen.style.display="none";
    appEl.style.display="block";
    const prenom=(user.displayName||"").split(" ")[0];
    document.getElementById("wel").textContent="Bonjour"+(prenom?", "+prenom:"");
    const av=document.getElementById("user-avatar");
    if(user.photoURL){av.src=user.photoURL;av.style.display="block";}
    else{av.style.display="none";}
    startListeners(user.uid);
  }else{
    stopListeners();
    appEl.style.display="none";
    authScreen.style.display="flex";
  }
});
</script>
</body>
</html>
