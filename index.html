<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShoppingHQ</title>
<script>
try{
  var t=localStorage.getItem("shq_theme");
  document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark");
}catch(e){
  document.documentElement.setAttribute("data-theme","dark");
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&family=Just+Another+Hand&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#000000;--tx:#FFFFFF;--ln:#FFFFFF;--bl:#2389D4;--act:#081828;--mu:#AAAAAA;}
html[data-theme="light"]{--bg:#FFFFFF;--tx:#000000;--ln:#000000;--bl:#2389D4;--act:#E0F4FF;--mu:#555555;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:"DM Sans",sans-serif;min-height:100vh;}

/* LOGO */
.g{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:300;letter-spacing:.2em;background:linear-gradient(170deg,#FFFBF0,#F9E07F,#F4A623,#C47D0E,#8A5600);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.sep{width:1px;background:var(--ln);align-self:center;}
.hq{font-family:"Just Another Hand",cursive;display:inline-block;transform:rotate(-2deg);}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg);border:1px solid var(--bl);color:var(--tx);padding:.6rem 1.2rem;border-radius:6px;font-size:.8rem;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center;}
#toast.show{opacity:1;}

/* AUTH */
#auth-screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem;}
.auth-card{display:flex;flex-direction:column;align-items:center;gap:1.75rem;border:1px solid var(--bl);border-radius:12px;padding:2.5rem 2rem;max-width:380px;width:100%;}
.auth-logo{display:flex;align-items:baseline;justify-content:center;}
.auth-logo .g{font-size:20px;}
.auth-logo .sep{height:28px;margin:0 14px;}
.auth-logo .hq{font-size:56px;line-height:1;}
.auth-line{width:100%;display:flex;align-items:center;gap:1rem;font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mu);}
.auth-line::before,.auth-line::after{content:"";flex:1;height:1px;background:var(--ln);opacity:.3;}
.btn-google{display:flex;align-items:center;justify-content:center;gap:.7rem;width:100%;background:transparent;color:var(--tx);border:1px solid var(--bl);border-radius:6px;padding:.85rem 1.5rem;font-family:"DM Sans",sans-serif;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;}
.btn-google:hover{background:var(--act);}
.btn-google svg{width:18px;height:18px;flex-shrink:0;}
.auth-note{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--mu);text-align:center;line-height:1.8;}

/* APP */
#app{display:none;}
.topnav{display:flex;align-items:center;padding:.6rem 1.1rem;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--bg);z-index:100;}
.nav-logo{display:flex;align-items:baseline;}
.nav-logo .g{font-size:16px;}
.nav-logo .sep{height:16px;margin:0 9px;}
.nav-logo .hq{font-size:24px;}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:.5rem;}
.icon-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--bl);background:transparent;color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font-size:.8rem;font-family:"DM Sans",sans-serif;}
.icon-btn:hover{background:var(--act);}
.icon-btn svg{width:16px;height:16px;}
.ico-sun{display:flex;}
.ico-moon{display:none;}
html[data-theme="light"] .ico-sun{display:none;}
html[data-theme="light"] .ico-moon{display:flex;}
.avatar{width:30px;height:30px;border-radius:50%;border:1px solid var(--ln);object-fit:cover;}

.content{max-width:720px;margin:0 auto;padding:1.25rem;}
.wel{font-family:"Just Another Hand",cursive;font-size:32px;line-height:1.1;transform:rotate(-2deg);transform-origin:left center;margin-bottom:.8rem;}
.info{font-size:.8rem;color:var(--mu);line-height:1.6;}
</style>
</head>
<body>

<div id="toast"></div>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo"><span class="g">Golden</span><span class="sep"></span><span class="hq">ShoppingHQ</span></div>
    <div class="auth-line">Connexion securisee</div>
    <button class="btn-google" type="button" onclick="signInWithGoogle()">
      <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Continuer avec Google
    </button>
    <div class="auth-note">Acces prive<br>Securise par Firebase Auth</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topnav">
    <div class="nav-logo"><span class="g">Golden</span><span class="sep"></span><span class="hq">ShoppingHQ</span></div>
    <div class="nav-right">
      <button class="icon-btn" type="button" onclick="toggleTheme()" title="Mode clair ou sombre">
        <span class="ico-sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
        <span class="ico-moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
      </button>
      <img class="avatar" id="user-avatar" src="" alt="" style="display:none">
      <button class="icon-btn" type="button" onclick="logout()" title="Quitter">&#10005;</button>
    </div>
  </div>
  <div class="content">
    <div class="wel" id="wel">Bonjour</div>
    <div class="info">Connexion reussie. Les onglets arrivent au prochain segment.</div>
  </div>
</div>

<script>
function signInWithGoogle(){window._signIn&&window._signIn();}
function logout(){window._logout&&window._logout();}
function toggleTheme(){
  var cur=document.documentElement.getAttribute("data-theme");
  var nxt=cur==="light"?"dark":"light";
  document.documentElement.setAttribute("data-theme",nxt);
  try{localStorage.setItem("shq_theme",nxt);}catch(e){}
}
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}
  from"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig={
  apiKey:"AIzaSyDd4i9kw_tVWVtdTcML_xEuR1qWScMAgAo",
  authDomain:"shoppinghq-543f9.firebaseapp.com",
  projectId:"shoppinghq-543f9",
  storageBucket:"shoppinghq-543f9.firebasestorage.app",
  messagingSenderId:"12958975168",
  appId:"1:12958975168:web:a6d28cbe8c187a41b1d925"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const provider=new GoogleAuthProvider();

function toast(msg,dur){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),dur||3000);
}

window._signIn=async()=>{
  try{await signInWithPopup(auth,provider);}
  catch(e){toast("Erreur: "+e.message);}
};
window._logout=()=>signOut(auth);

onAuthStateChanged(auth,user=>{
  const authScreen=document.getElementById("auth-screen");
  const appEl=document.getElementById("app");
  if(user){
    authScreen.style.display="none";
    appEl.style.display="block";
    const prenom=(user.displayName||"").split(" ")[0];
    document.getElementById("wel").textContent="Bonjour"+(prenom?", "+prenom:"");
    const av=document.getElementById("user-avatar");
    if(user.photoURL){av.src=user.photoURL;av.style.display="block";}
    else{av.style.display="none";}
  }else{
    appEl.style.display="none";
    authScreen.style.display="flex";
  }
});
</script>
</body>
</html>
